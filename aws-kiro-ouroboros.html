<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>루프가 Kiro를 만나면 · AWS Kiro와 함께하는 Ouroboros</title>
<meta name="description" content="Kiro CLI 워크숍 · AWS Kiro와 함께하는 Ouroboros — 철학, 통합, 그리고 한 바퀴." />
<script>
  (function(){
    try{
      var t = localStorage.getItem('q00-blog-theme') || 'system';
      var dark = t === 'dark' || (t === 'system' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      if(dark) document.documentElement.classList.add('dark');
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#faf9f5; --ink:#1c1917; --muted:#78716c; --faint:#a8a29e;
    --rule:#e7e5e4; --tint:#fdfcf9;
    --display:'Fraunces','Noto Serif KR',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  html.dark{
    --paper:#0c0a09; --ink:#e7e5e4; --muted:#a8a29e; --faint:#57534e;
    --rule:#292524; --tint:#1c1917;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{ height:100%; background:var(--paper) }
  body{
    color:var(--ink); font-family:var(--display);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none }

  .top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 24px; font-family:var(--mono); font-size:11px;
    text-transform:uppercase; letter-spacing:.16em; color:var(--muted);
    border-bottom:1px solid var(--rule); flex:0 0 auto;
  }
  .top a:hover{ color:var(--ink) }
  .top-left{ display:flex; align-items:center; gap:18px; min-width:0 }
  .top-title{
    font-family:var(--display); text-transform:none; letter-spacing:0;
    font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .top-right{ display:flex; align-items:center; gap:18px; flex:0 0 auto }
  .toggle{
    background:none; border:0; cursor:pointer; padding:2px;
    font-family:var(--mono); font-size:13px; color:var(--muted); line-height:1;
  }
  .toggle:hover{ color:var(--ink) }

  .viewer{ flex:1 1 auto; min-height:0; background:var(--tint) }
  .viewer iframe{ width:100%; height:100%; border:none; display:block }

  .fallback{
    display:none; padding:48px 24px; text-align:center; color:var(--muted);
    font-size:14px; line-height:1.7;
  }
  .fallback a{ color:var(--ink); border-bottom:1px solid var(--faint) }
  .no-pdf .viewer{ display:none }
  .no-pdf .fallback{ display:block }
</style>
</head>
<body>
  <div class="top">
    <div class="top-left">
      <a href="./index.html">← Talks</a>
      <span class="top-title">루프가 Kiro를 만나면 · AWS Kiro와 함께하는 Ouroboros</span>
    </div>
    <div class="top-right">
      <a href="./aws-kiro-ouroboros.pdf" target="_blank" rel="noreferrer">PDF 다운로드 ↗</a>
      <button class="toggle" id="themeToggle" type="button" aria-label="Toggle light or dark theme"></button>
    </div>
  </div>

  <div class="viewer">
    <iframe src="./aws-kiro-ouroboros.pdf" title="루프가 Kiro를 만나면 — AWS Kiro와 함께하는 Ouroboros"></iframe>
  </div>
  <div class="fallback">
    이 브라우저는 PDF를 바로 보여줄 수 없습니다.
    <a href="./aws-kiro-ouroboros.pdf">PDF를 새 탭에서 열어주세요 →</a>
  </div>

  <script>
    (function(){
      var btn = document.getElementById('themeToggle');
      var root = document.documentElement;
      function paint(){ btn.textContent = root.classList.contains('dark') ? '☀' : '☾'; }
      paint();
      btn.addEventListener('click', function(){
        var dark = root.classList.toggle('dark');
        try{ localStorage.setItem('q00-blog-theme', dark ? 'dark' : 'light'); }catch(e){}
        paint();
      });
    })();
  </script>
</body>
</html>
